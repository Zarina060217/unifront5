<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Assignment 5</title>
    </head>
    <body>
        <p id="task2Info"></p>

        <form id="profileForm">
            <label>Username: </label>
            <input type="text" id="username" required><br><br>

            <label>Birth Year: </label>
            <input type="number" id="birthYear" required><br><br>

            <button type="submit">Create Profile</button>
        </form>

        <p id="profileInfo"></p>

        <h2>Hobbies</h2>
        <ul id="hobbyList">
            <li>Horse riding</li>
            <li>Reading books</li>
            <li>Dancing latino</li>
        </ul>

        <button id="addButton">Add Item</button>
        <button id="removeButton">Remove Item</button>

        <script>
            const userProfile = {
                name: "Khalid",
                birthYear: 2003,
                isDeveloper: true,
                hobbies: ["Horse riding", "Reading books", "Dancing latino"]
            };

            let currentYear = new Date().getFullYear();
            let age = currentYear - userProfile.birthYear; 
            let hobbiesCount = userProfile.hobbies.length;
            
            console.log("Age: "+ age);
            console.log("Hobbies count:"+ hobbiesCount);

            document.getElementById("task2Info").textContent = 
            "Age: " + age + " | Hobbies count: " + hobbiesCount;

            function showProfile() {
                let currentYear = new Date().getFullYear();
                let age = currentYear - userProfile.birthYear;

                document.getElementById("profileInfo").textContent = 
                "Name: " + userProfile.name +
                ", Age: " + age +
                ", Developer: " + userProfile.isDeveloper +
                ", Hobbies: " + userProfile.hobbies.length;
            }
            showProfile();

            /*4*/
            document.getElementById("profileForm").addEventListener("submit", function(event) {
                event.preventDefault();

                userProfile.name = document.getElementById("username").value;
                userProfile.birthYear = Number(document.getElementById("birthYear").value);

                showProfile();

                let age = new Date().getFullYear() - userProfile.birthYear;
                console.log("Age: "+ age);
                console.log("Hobbies count: " + userProfile.hobbies.length);
            });

            document.getElementById("addButton").addEventListener("click", function() {
                let itemText = prompt("Enter a hobby or task:");

                if (itemText !== null && itemText.trim() !== "") {
                    let item = document.createElement("li");
                    item.textContent = itemText;

                    document.getElementById("hobbyList").appendChild(item);
                    userProfile.hobbies.push(itemText);

                    showProfile();
                }
            });

            document.getElementById("removeButton").addEventListener("click", function() {
                let list = document.getElementById("hobbyList");

                if (list.lastElementChild !== null) {
                    list.removeChild(list.lastElementChild);
                    userProfile.hobbies.pop();

                    showProfile();
                }
            });
        </script>
    </body>
</html>
